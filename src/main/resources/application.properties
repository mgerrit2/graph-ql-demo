spring.application.name=graph-ql-demo

#######################################################################
# Docker PostgreSQL Connection
#######################################################################
#sql server https://springframework.guru/configuring-spring-boot-for-microsoft-sql-server/
spring.datasource.url=jdbc:postgresql://172.22.133.5:5433/gscience-security-dev
#spring.datasource.url=jdbc:postgresql://localhost:5433/gscience-security-dev
spring.datasource.username=${dynamic_database_accesss_pring_datasource_username}
spring.datasource.password=${dynamic_database_accesss_pring_datasource_password}
spring.datasource.driver-class-name=org.postgresql.Driver

#######################################################################
# Hibernate settings
#######################################################################
# JPA / Hibernate settings voor Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# 2. Stop Hibernate from querying database metadata on boot
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

datasourceActive=true

#######################################################################
#  ssl settings
#######################################################################
server.ssl.enabled=false

#######################################################################
# liquibase settings
#######################################################################
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
spring.liquibase.contexts=dev,dev_data
spring.liquibase.label-filter=dev


#######################################################################
# grapql settings
#######################################################################
spring.graphql.graphiql.enabled=true