plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle'
	id 'com.github.spotbugs' version '6.4.8'
	id 'pmd'
}

group = 'com.graph.ql'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// the graphql that is used for the sample
	implementation 'org.springframework.boot:spring-boot-starter-graphql'


	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.6.3' // or latest stable version
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	// Make sure Lombok annotation processor comes AFTER or alongside MapStruct processor
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// postgreSQL
	runtimeOnly 'org.postgresql:postgresql'

	// radis caching
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'

	// liquibase
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'

	compileOnly 'org.projectlombok:lombok'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-graphql-test'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testAnnotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.liquibase:liquibase-core'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

}

tasks.named('test') {
	useJUnitPlatform()
}

/**
 * Best for enforcing team formatting & style
 * You can find the commands under verification
 * S
 */
checkstyle {
	toolVersion = '10.24.0' // Use your preferred Checkstyle version
	configFile = file("${rootDir}/config/checkstyle/checkstyle.xml") // Optional custom path
	ignoreFailures = false // Set to true if you only want warnings without failing the build
	maxWarnings = 0
}

spotbugs {
	toolVersion = '4.9.8'
	ignoreFailures = false
	effort = 'max' // min, default, or max
	reportLevel = 'medium' // low, medium, or high
}

spotbugsMain {
	ignoreFailures = true
}

// Optional: Configure reports to generate HTML instead of just XML
tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
	reports {
		html {
			required = true
			outputLocation = file("$buildDir/reports/spotbugs/main.html")
		}
	}
}

pmd {
	toolVersion = '7.16.0'
	ruleSets = []
	ruleSetFiles = files('config/pmd/ruleset.xml')
	ignoreFailures = false
}